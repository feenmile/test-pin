# Copy to .github/workflows/test-pin.yml in your repository.
name: test-pin
on: pull_request

permissions:
  contents: read

jobs:
  test-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # test-pin needs the base commit and history to find the merge-base
      # Replace <account> and <ref> with where you host test-pin.
      - uses: <account>/test-pin@<ref>
        with:
          tests: "tests/**,**/conftest.py,pytest.ini"
          run: "pip install -e . && python -m pytest -q"
