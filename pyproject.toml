[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "test-pin"
version = "0.1.0"
description = "Judge a change with the test files from its base commit, so editing tests cannot make it pass."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Feenmile" }]
keywords = ["testing", "ci", "git", "ai-agents", "code-review"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/feenmile/test-pin"
Source = "https://github.com/feenmile/test-pin"

[project.scripts]
testpin = "testpin.cli:main"
testpin-hook = "testpin.hook:main"

[tool.setuptools]
packages = ["testpin"]
